  title: CREST Statistics Junior Seminar
  subtitle: A seminar for PhD students to share current work, discuss open questions, and connect across research topics.
  academic_year: 2026-2027
  status: First session
  location: CREST, ENSAE Paris
  day: Mondays
  time: "12:30-13:30"
  frequency: Twice a month
