submission:
  title: Proposals are open
  text: Submit a tentative title, a short abstract, and your preferred Monday availability. We will contact you by email to confirm the details.
  invitation: All PhD students are welcome to propose a talk, from first-year students introducing their PhD topic to more advanced students sharing recent results. Feel free to invite PhD students from other universities or labs.

